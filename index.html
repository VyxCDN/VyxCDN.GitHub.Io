in-top:8px;font-size:.7rem;cursor:pointer}.copy-btn:hover{background:#3a404c}.toast{position:fixed;bottom:20px;right:20px;background:#1e2a3a;color:#bbf0ff;padding:8px 16px;border-radius:40px;font-size:.8rem;opacity:0;transition:.2s;pointer-events:none;z-index:1000}.toast.show{opacity:1}.badge{font-size:.7rem;background:#2e3b2e;display:inline-block;padding:2px 6px;border-radius:20px;margin-left:8px}.error-message{background:#3a1e1e;padding:1rem;border-radius:12px;color:#ff9e9e}</style></head><body><h1>📦 Vyx CDN <span class="badge">pub</span></h1><p>Публичные файлы из <code>icon/</code> (с подпапками), <code>flag/</code>, <code>social/</code>.</p><div id="content"></div><div id="toast" class="toast">🔗 Скопировано!</div><script id="vyx-data" type="application/json">{
            "icons": {{ site.static_files | where_exp: "file", "file.path contains '/icon/'" | map: "path" | json }},
            "flags": {{ site.static_files | where_exp: "file", "file.path contains '/flag/'" | map: "path" | json }},
            "social": {{ site.static_files | where_exp: "file", "file.path contains '/social/'" | map: "path" | json }}
        }</script><script>!function(){function e(e){return e.replace(/[&<>]/g,function(e){return"&"===e?"&amp;":"<"===e?"&lt;":">"===e?"&gt;":e})}function t(t){const n=t.split("/").pop(),o=window.location.origin+t,s=document.createElement("div");s.className="file-card",s.innerHTML=`\n                    <div style="min-height: 90px; display: flex; align-items: center; justify-content: center;">\n                        ${function(t){const n=t.split(".").pop().toLowerCase();return function(e){return["jpg","jpeg","png","gif","webp","svg","bmp"].includes(e)}(n)?`<img src="${e(t)}" loading="lazy" alt="preview" onerror="this.style.display='none'" style="max-height:80px">`:function(e){return["mp4","webm","mov","ogv"].includes(e)}(n)?`<video src="${e(t)}" controls preload="none" style="max-height:80px"></video>`:function(e){return["mp3","wav","ogg","flac","m4a"].includes(e)}(n)?`<audio src="${e(t)}" controls style="width:120px; height:32px"></audio>`:'<div style="font-size: 2rem;">📄</div>'}(t)}\n                    </div>\n                    <div class="file-name" title="${e(n)}">${e(n.substring(0,25))}${n.length>25?"…":""}</div>\n                    <button class="copy-btn" data-url="${e(o)}">📋 Копировать ссылку</button>\n                    <div style="margin-top: 6px;"><a href="${e(t)}" download="${e(n)}">⬇️ Скачать</a></div>\n                `;const c=s.querySelector(".copy-btn");return c.addEventListener("click",e=>{var t;e.stopPropagation(),t=c.getAttribute("data-url"),navigator.clipboard.writeText(t).then(()=>{const e=document.getElementById("toast");e.classList.add("show"),setTimeout(()=>e.classList.remove("show"),1500)})}),s}const n=document.getElementById("vyx-data");let o={icons:[],flags:[],social:[]};if(n&&""!==n.textContent.trim())try{const e=JSON.parse(n.textContent);o={icons:e.icons||[],flags:e.flags||[],social:e.social||[]}}catch(e){console.error("Ошибка парсинга JSON от Jekyll:",e),document.getElementById("content").innerHTML='<div class="error-message">❌ Ошибка: Jekyll не обработал данные. Убедитесь, что в корне нет файла <code>.nojekyll</code> и добавлен <code>_config.yml</code>.</div>'}else document.getElementById("content").innerHTML='<div class="error-message">⚠️ Jekyll не передал данные. Проверьте настройки GitHub Pages: удалите <code>.nojekyll</code>, добавьте <code>_config.yml</code>.</div>';!function(n){const o=document.getElementById("content");if(o.innerHTML="",n.flags&&n.flags.length){const e=document.createElement("div");e.className="category",e.innerHTML=`<h2>🏳️ Флаги (${n.flags.length})</h2><div class="files"></div>`;const s=e.querySelector(".files");n.flags.sort().forEach(e=>s.appendChild(t(e))),o.appendChild(e)}if(n.icons&&n.icons.length){const s=document.createElement("div");s.className="category",s.innerHTML=`<h2>🖼️ Иконки (${n.icons.length})</h2>`,o.appendChild(s);const c=function(e){const t=new Map;for(const n of e){const e=n.split("/").filter(e=>e);if(e.length>=3){const o=e[1];t.has(o)||t.set(o,[]),t.get(o).push(n)}else 2===e.length&&(t.has("root")||t.set("root",[]),t.get("root").push(n))}return t}(n.icons),i=Array.from(c.keys()).sort((e,t)=>"root"===e?-1:"root"===t?1:e.localeCompare(t));for(const n of i){const o=c.get(n),i=document.createElement("div");i.className="subcat";const l="root"===n?"Корень icon/":n;i.innerHTML=`<h3>📁 ${e(l)} (${o.length})</h3><div class="files"></div>`;const a=i.querySelector(".files");o.sort().forEach(e=>a.appendChild(t(e))),s.appendChild(i)}}if(n.social&&n.social.length){const e=document.createElement("div");e.className="category",e.innerHTML=`<h2>📱 Соцсети (${n.social.length})</h2><div class="files"></div>`;const s=e.querySelector(".files");n.social.sort().forEach(e=>s.appendChild(t(e))),o.appendChild(e)}n.icons&&n.icons.length||n.flags&&n.flags.length||n.social&&n.social.length||(o.innerHTML="<p>⚠️ Публичные папки пока пусты. Добавь файлы в <code>icon/</code>, <code>flag/</code> или <code>social/</code>.</p>")}(o)}()</script></body></html>
