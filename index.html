<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyx CDN – публичная статика</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1300px; margin: 2rem auto; padding: 0 1rem; background: #0d0f12; color: #eef; }
        h1, h2 { border-bottom: 1px solid #2a2e35; padding-bottom: 0.3rem; }
        .category { margin-bottom: 2.5rem; }
        .subcat { margin-left: 1rem; margin-top: 1rem; }
        .subcat h3 { font-size: 1.2rem; color: #bbd; margin-bottom: 0.5rem; }
        .files { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
        .file-card {
            background: #1a1d24;
            border-radius: 12px;
            padding: 0.75rem;
            width: 140px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: 0.1s;
        }
        .file-card:hover { transform: translateY(-2px); background: #22262e; }
        .file-card a { text-decoration: none; color: #6bc0ff; word-break: break-all; font-size: 0.8rem; }
        .file-card img, .file-card video, .file-card audio {
            max-width: 100%;
            max-height: 80px;
            border-radius: 8px;
            object-fit: contain;
            background: #00000055;
        }
        .file-name { margin-top: 8px; font-size: 0.75rem; opacity: 0.8; word-break: break-word; }
        .copy-btn {
            background: #2a2f38;
            border: none;
            color: white;
            border-radius: 20px;
            padding: 4px 8px;
            margin-top: 8px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .copy-btn:hover { background: #3a404c; }
        .toast {
            position: fixed; bottom: 20px; right: 20px;
            background: #1e2a3a; color: #bbf0ff;
            padding: 8px 16px; border-radius: 40px;
            font-size: 0.8rem; opacity: 0; transition: 0.2s;
            pointer-events: none; z-index: 1000;
        }
        .toast.show { opacity: 1; }
        .badge { font-size: 0.7rem; background: #2e3b2e; display: inline-block; padding: 2px 6px; border-radius: 20px; margin-left: 8px; }
        .error-message { background: #3a1e1e; padding: 1rem; border-radius: 12px; color: #ff9e9e; }
    </style>
</head>
<body>
    <h1>📦 Vyx CDN <span class="badge">pub</span></h1>
    <p>Публичные файлы из <code>icon/</code> (с подпапками), <code>flag/</code>, <code>social/</code>.</p>
    <div id="content"></div>
    <div id="toast" class="toast">🔗 Скопировано!</div>

    <!-- Данные от Jekyll в безопасном JSON-контейнере -->
    <script id="vyx-data" type="application/json">
        {
            "icons": {{ site.static_files | where_exp: "file", "file.path contains '/icon/'" | map: "path" | json }},
            "flags": {{ site.static_files | where_exp: "file", "file.path contains '/flag/'" | map: "path" | json }},
            "social": {{ site.static_files | where_exp: "file", "file.path contains '/social/'" | map: "path" | json }}
        }
    </script>

    <script>
        (function() {
            // Функции для работы с файлами
            function getFileExtension(filename) {
                return filename.split('.').pop().toLowerCase();
            }

            function isPreviewable(ext) {
                return ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'].includes(ext);
            }

            function isVideo(ext) {
                return ['mp4', 'webm', 'mov', 'ogv'].includes(ext);
            }

            function isAudio(ext) {
                return ['mp3', 'wav', 'ogg', 'flac', 'm4a'].includes(ext);
            }

            function renderPreview(filePath) {
                const ext = getFileExtension(filePath);
                if (isPreviewable(ext)) {
                    return `<img src="${escapeHtml(filePath)}" loading="lazy" alt="preview" onerror="this.style.display='none'" style="max-height:80px">`;
                } else if (isVideo(ext)) {
                    return `<video src="${escapeHtml(filePath)}" controls preload="none" style="max-height:80px"></video>`;
                } else if (isAudio(ext)) {
                    return `<audio src="${escapeHtml(filePath)}" controls style="width:120px; height:32px"></audio>`;
                } else {
                    return `<div style="font-size: 2rem;">📄</div>`;
                }
            }

            function escapeHtml(str) {
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            function copyToClipboard(url) {
                navigator.clipboard.writeText(url).then(() => {
                    const toast = document.getElementById('toast');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 1500);
                });
            }

            function renderFileCard(filePath) {
                const fileName = filePath.split('/').pop();
                const absoluteUrl = window.location.origin + filePath;
                const card = document.createElement('div');
                card.className = 'file-card';
                card.innerHTML = `
                    <div style="min-height: 90px; display: flex; align-items: center; justify-content: center;">
                        ${renderPreview(filePath)}
                    </div>
                    <div class="file-name" title="${escapeHtml(fileName)}">${escapeHtml(fileName.substring(0, 25))}${fileName.length>25 ? '…' : ''}</div>
                    <button class="copy-btn" data-url="${escapeHtml(absoluteUrl)}">📋 Копировать ссылку</button>
                    <div style="margin-top: 6px;"><a href="${escapeHtml(filePath)}" download="${escapeHtml(fileName)}">⬇️ Скачать</a></div>
                `;
                const btn = card.querySelector('.copy-btn');
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyToClipboard(btn.getAttribute('data-url'));
                });
                return card;
            }

            function groupIconFiles(iconPaths) {
                const groups = new Map();
                for (const path of iconPaths) {
                    const parts = path.split('/').filter(p => p);
                    if (parts.length >= 3) {
                        const subfolder = parts[1];
                        if (!groups.has(subfolder)) groups.set(subfolder, []);
                        groups.get(subfolder).push(path);
                    } else if (parts.length === 2) {
                        if (!groups.has('root')) groups.set('root', []);
                        groups.get('root').push(path);
                    }
                }
                return groups;
            }

            function buildPage(data) {
                const container = document.getElementById('content');
                container.innerHTML = '';

                // Флаги
                if (data.flags && data.flags.length) {
                    const section = document.createElement('div');
                    section.className = 'category';
                    section.innerHTML = `<h2>🏳️ Флаги (${data.flags.length})</h2><div class="files"></div>`;
                    const filesDiv = section.querySelector('.files');
                    data.flags.sort().forEach(path => filesDiv.appendChild(renderFileCard(path)));
                    container.appendChild(section);
                }

                // Иконки с группировкой
                if (data.icons && data.icons.length) {
                    const iconsSection = document.createElement('div');
                    iconsSection.className = 'category';
                    iconsSection.innerHTML = `<h2>🖼️ Иконки (${data.icons.length})</h2>`;
                    container.appendChild(iconsSection);

                    const groups = groupIconFiles(data.icons);
                    const groupNames = Array.from(groups.keys()).sort((a,b) => {
                        if (a === 'root') return -1;
                        if (b === 'root') return 1;
                        return a.localeCompare(b);
                    });

                    for (const groupName of groupNames) {
                        const files = groups.get(groupName);
                        const subDiv = document.createElement('div');
                        subDiv.className = 'subcat';
                        const displayName = groupName === 'root' ? 'Корень icon/' : groupName;
                        subDiv.innerHTML = `<h3>📁 ${escapeHtml(displayName)} (${files.length})</h3><div class="files"></div>`;
                        const filesDiv = subDiv.querySelector('.files');
                        files.sort().forEach(path => filesDiv.appendChild(renderFileCard(path)));
                        iconsSection.appendChild(subDiv);
                    }
                }

                // Соцсети
                if (data.social && data.social.length) {
                    const section = document.createElement('div');
                    section.className = 'category';
                    section.innerHTML = `<h2>📱 Соцсети (${data.social.length})</h2><div class="files"></div>`;
                    const filesDiv = section.querySelector('.files');
                    data.social.sort().forEach(path => filesDiv.appendChild(renderFileCard(path)));
                    container.appendChild(section);
                }

                if ((!data.icons || !data.icons.length) && (!data.flags || !data.flags.length) && (!data.social || !data.social.length)) {
                    container.innerHTML = '<p>⚠️ Публичные папки пока пусты. Добавь файлы в <code>icon/</code>, <code>flag/</code> или <code>social/</code>.</p>';
                }
            }

            // Пытаемся получить данные из JSON-тега, сгенерированного Jekyll
            const scriptTag = document.getElementById('vyx-data');
            let fileData = { icons: [], flags: [], social: [] };

            if (scriptTag && scriptTag.textContent.trim() !== '') {
                try {
                    const parsed = JSON.parse(scriptTag.textContent);
                    fileData = {
                        icons: parsed.icons || [],
                        flags: parsed.flags || [],
                        social: parsed.social || []
                    };
                } catch (e) {
                    console.error('Ошибка парсинга JSON от Jekyll:', e);
                    document.getElementById('content').innerHTML = '<div class="error-message">❌ Ошибка: Jekyll не обработал данные. Убедитесь, что в корне нет файла <code>.nojekyll</code> и добавлен <code>_config.yml</code>.</div>';
                }
            } else {
                document.getElementById('content').innerHTML = '<div class="error-message">⚠️ Jekyll не передал данные. Проверьте настройки GitHub Pages: удалите <code>.nojekyll</code>, добавьте <code>_config.yml</code>.</div>';
            }

            buildPage(fileData);
        })();
    </script>
</body>
</html>
