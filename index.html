="/vyxicon/android-chrome-256x256.png"><link rel="icon" type="image/png" sizes="384x384" href="/vyxicon/android-chrome-384x384.png"><link rel="icon" type="image/png" sizes="512x512" href="/vyxicon/android-chrome-512x512.png"><link rel="icon" type="image/png" sizes="1024x1024" href="/vyxicon/android-chrome-1024x1024.png"><link rel="icon" type="image/png" sizes="192x192" href="/vyxicon/android-icon-192x192.png"><link rel="icon" type="image/png" sizes="192x192" href="/vyxicon/maskable-icon-192x192.png"><link rel="icon" type="image/png" sizes="512x512" href="/vyxicon/maskable-icon-512x512.png"><link rel="icon" type="image/png" sizes="1024x1024" href="/vyxicon/maskable-icon-1024x1024.png"><meta name="msapplication-TileImage" content="/vyxicon/mstile-70x70.png"><meta name="msapplication-TileImage" content="/vyxicon/mstile-150x150.png"><meta name="msapplication-TileImage" content="/vyxicon/mstile-310x310.png"><link rel="mask-icon" href="/vyxicon/favicon.svg" color="#000000"><title>Vyx CDN – публичная статика</title> <style>body{font-family:system-ui,sans-serif;max-width:1300px;margin:2rem auto;padding:0 1rem;background:#0d0f12;color:#eef}h1,h2{border-bottom:1px solid #2a2e35;padding-bottom:.3rem}.category{margin-bottom:2.5rem}.subcat{margin-left:1rem;margin-top:1rem}.subcat h3{font-size:1.2rem;color:#bbd;margin-bottom:.5rem}.files{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-start}.file-card{background:#1a1d24;border-radius:12px;padding:.75rem;width:140px;text-align:center;box-shadow:0 2px 5px #0000004d;transition:.1s}.file-card:hover{transform:translateY(-2px);background:#22262e}.file-card a{text-decoration:none;color:#6bc0ff;word-break:break-all;font-size:.8rem}.file-card audio,.file-card img,.file-card video{max-width:100%;max-height:80px;border-radius:8px;object-fit:contain;background:#0006}.file-name{margin-top:8px;font-size:.75rem;opacity:.8;word-break:break-word}.copy-btn{background:#2a2f38;border:none;color:#fff;border-radius:20px;padding:4px 8px;margin-top:8px;font-size:.7rem;cursor:pointer}.copy-btn:hover{background:#3a404c}.toast{position:fixed;bottom:20px;right:20px;background:#1e2a3a;color:#bbf0ff;padding:8px 16px;border-radius:40px;font-size:.8rem;opacity:0;transition:.2s;pointer-events:none;z-index:1000}.toast.show{opacity:1}.badge{font-size:.7rem;background:#2e3b2e;display:inline-block;padding:2px 6px;border-radius:20px;margin-left:8px}.error-message{background:#3a1e1e;padding:1rem;border-radius:12px;color:#ff9e9e}.loader{text-align:center;padding:2rem;font-size:1.2rem}</style> </head><body><h1>📦 Vyx CDN <span class="badge">pub</span></h1><p>Публичные файлы из <code>icon/</code> (с подпапками), <code>flag/</code>, <code>social/</code>.</p><div id="content"><div class="loader">⏳ Загрузка файлов...</div></div><div id="toast" class="toast">🔗 Скопировано!</div> <script>(function() { const host = window.location.hostname; let owner = '', repo = ''; if (host.endsWith('.github.io')) { const parts = host.split('.'); owner = parts[0]; repo = `${owner}.github.io`; } else { owner = 'VyxCDN'; repo = 'VyxCDN.GitHub.Io'; } const baseUrl = `https://api.github.com/repos/${owner}/${repo}/contents`; const publicFolders = ['icon', 'flag', 'social']; async function getFilesRecursively(path, allFiles = []) { const url = `${baseUrl}/${encodeURIComponent(path)}`; try { const res = await fetch(url); if (!res.ok) return []; const data = await res.json(); for (const item of data) { if (item.type === 'file') { const pageUrl = `/${item.path}`; allFiles.push(pageUrl); } else if (item.type === 'dir') { await getFilesRecursively(item.path, allFiles); } } } catch (e) { console.error(`Ошибка загрузки ${path}:`, e); } return allFiles; } function getExtension(filename) { return filename.split('.').pop().toLowerCase(); } function isPreviewable(ext) { return ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'].includes(ext); } function isVideo(ext) { return ['mp4', 'webm', 'mov', 'ogv'].includes(ext); } function isAudio(ext) { return ['mp3', 'wav', 'ogg', 'flac', 'm4a'].includes(ext); } function renderPreview(filePath) { const ext = getExtension(filePath); const escaped = filePath.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); if (isPreviewable(ext)) { return `<img src="${escaped}" loading="lazy" alt="preview" onerror="this.style.display='none'" style="max-height:80px">`; } else if (isVideo(ext)) { return `<video src="${escaped}" controls preload="none" style="max-height:80px"></video>`; } else if (isAudio(ext)) { return `<audio src="${escaped}" controls style="width:120px;height:32px"></audio>`; } else { return '<div style="font-size:2rem;">📄</div>'; } } function copyToClipboard(url) { navigator.clipboard.writeText(url).then(() => { const toast = document.getElementById('toast'); toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1500); }); } function createFileCard(filePath) { const fileName = filePath.split('/').pop(); const absoluteUrl = window.location.origin + filePath; const card = document.createElement('div'); card.className = 'file-card'; card.innerHTML = ` <div style="min-height:90px;display:flex;align-items:center;justify-content:center"> ${renderPreview(filePath)} </div> <div class="file-name" title="${fileName.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}"> ${fileName.substring(0,25)}${fileName.length>25 ? '…' : ''} </div> <button class="copy-btn" data-url="${absoluteUrl.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}"> 📋 Копировать ссылку </button> <div style="margin-top:6px"><a href="${filePath}" download="${fileName}">⬇️ Скачать</a></div> `; const btn = card.querySelector('.copy-btn'); btn.addEventListener('click', (e) => { e.stopPropagation(); copyToClipboard(btn.getAttribute('data-url')); }); return card; } function groupIconFiles(paths) { const groups = new Map(); for (const p of paths) { const parts = p.split('/').filter(part => part); if (parts.length >= 3) { const sub = parts[1]; if (!groups.has(sub)) groups.set(sub, []); groups.get(sub).push(p); } else if (parts.length === 2) { if (!groups.has('root')) groups.set('root', []); groups.get('root').push(p); } } return groups; } async function loadAll() { const contentDiv = document.getElementById('content'); contentDiv.innerHTML = '<div class="loader">⏳ Загрузка файлов...</div>'; try { const [icons, flags, social] = await Promise.all([ getFilesRecursively('icon'), getFilesRecursively('flag'), getFilesRecursively('social') ]); contentDiv.innerHTML = ''; if (flags.length) { const sec = document.createElement('div'); sec.className = 'category'; sec.innerHTML = `<h2>🏳️ Флаги (${flags.length})</h2><div class="files"></div>`; const filesDiv = sec.querySelector('.files'); flags.sort().forEach(p => filesDiv.appendChild(createFileCard(p))); contentDiv.appendChild(sec); } if (icons.length) { const sec = document.createElement('div'); sec.className = 'category'; sec.innerHTML = `<h2>🖼️ Иконки (${icons.length})</h2>`; contentDiv.appendChild(sec); const groups = groupIconFiles(icons); const groupNames = Array.from(groups.keys()).sort((a,b) => { if (a === 'root') return -1; if (b === 'root') return 1; return a.localeCompare(b); }); for (const gname of groupNames) { const files = groups.get(gname); const sub = document.createElement('div'); sub.className = 'subcat'; const display = gname === 'root' ? 'Корень icon/' : gname; sub.innerHTML = `<h3>📁 ${display} (${files.length})</h3><div class="files"></div>`; const filesDiv = sub.querySelector('.files'); files.sort().forEach(p => filesDiv.appendChild(createFileCard(p))); sec.appendChild(sub); } } if (social.length) { const sec = document.createElement('div'); sec.className = 'category'; sec.innerHTML = `<h2>📱 Соцсети (${social.length})</h2><div class="files"></div>`; const filesDiv = sec.querySelector('.files'); social.sort().forEach(p => filesDiv.appendChild(createFileCard(p))); contentDiv.appendChild(sec); } if (!icons.length && !flags.length && !social.length) { contentDiv.innerHTML = '<p>⚠️ Публичные папки пока пусты. Добавь файлы в <code>icon/</code>, <code>flag/</code> или <code>social/</code>.</p>'; } } catch (err) { console.error(err); contentDiv.innerHTML = `<div class="error-message">❌ Ошибка загрузки: ${err.message}. Проверь соединение или название репозитория.</div>`; } } loadAll(); })();</script> </body></html>
